<!doctype html><html><head><meta charset="utf-8"><style>

</style></head><body><h1>AKKI MEISTER — ///AM colour iterations</h1>
<p class="lead">24 iterations on your two picks (cobalt fade bars · red chequered fade) plus hybrids · each shown on Midnight and Ice · files in FINAL-AM/iter2/ (d- dark, l- light)</p><section><h2>A · Fade bars</h2><div class="grid"><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-cobalt.svg"/></div><div class="t l"><img src="iter2/l-a-fade-cobalt.svg"/></div></div><figcaption><b>01</b> Fade · cobalt<span>a-fade-cobalt</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-red.svg"/></div><div class="t l"><img src="iter2/l-a-fade-red.svg"/></div></div><figcaption><b>02</b> Fade · red<span>a-fade-red</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-teal.svg"/></div><div class="t l"><img src="iter2/l-a-fade-teal.svg"/></div></div><figcaption><b>03</b> Fade · teal<span>a-fade-teal</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-orange.svg"/></div><div class="t l"><img src="iter2/l-a-fade-orange.svg"/></div></div><figcaption><b>04</b> Fade · orange<span>a-fade-orange</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-purple.svg"/></div><div class="t l"><img src="iter2/l-a-fade-purple.svg"/></div></div><figcaption><b>05</b> Fade · purple<span>a-fade-purple</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-mono.svg"/></div><div class="t l"><img src="iter2/l-a-fade-mono.svg"/></div></div><figcaption><b>06</b> Fade · mono<span>a-fade-mono</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-cobalt-steep.svg"/></div><div class="t l"><img src="iter2/l-a-fade-cobalt-steep.svg"/></div></div><figcaption><b>07</b> Steeper fade<span>a-fade-cobalt-steep</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-cobalt-reverse.svg"/></div><div class="t l"><img src="iter2/l-a-fade-cobalt-reverse.svg"/></div></div><figcaption><b>08</b> Reverse fade (bright outside)<span>a-fade-cobalt-reverse</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-cobalt-wide.svg"/></div><div class="t l"><img src="iter2/l-a-fade-cobalt-wide.svg"/></div></div><figcaption><b>09</b> Fade + wider gap to A<span>a-fade-cobalt-wide</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-a-fade-duo.svg"/></div><div class="t l"><img src="iter2/l-a-fade-duo.svg"/></div></div><figcaption><b>10</b> Cobalt → teal<span>a-fade-duo</span></figcaption></figure></div></section><section><h2>B · Chequered fade</h2><div class="grid"><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-red.svg"/></div><div class="t l"><img src="iter2/l-b-chk-red.svg"/></div></div><figcaption><b>11</b> Red chequer · 5 rows<span>b-chk-red</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-red-phase.svg"/></div><div class="t l"><img src="iter2/l-b-chk-red-phase.svg"/></div></div><figcaption><b>12</b> Red chequer · flipped phase<span>b-chk-red-phase</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-red-3rows.svg"/></div><div class="t l"><img src="iter2/l-b-chk-red-3rows.svg"/></div></div><figcaption><b>13</b> Red chequer · 3 rows (bigger squares)<span>b-chk-red-3rows</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-red-8rows.svg"/></div><div class="t l"><img src="iter2/l-b-chk-red-8rows.svg"/></div></div><figcaption><b>14</b> Red chequer · 8 rows (fine)<span>b-chk-red-8rows</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-red-solid-only.svg"/></div><div class="t l"><img src="iter2/l-b-chk-red-solid-only.svg"/></div></div><figcaption><b>15</b> Filled squares only (no outlines)<span>b-chk-red-solid-only</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-red-strong.svg"/></div><div class="t l"><img src="iter2/l-b-chk-red-strong.svg"/></div></div><figcaption><b>16</b> Red chequer · no fade<span>b-chk-red-strong</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-cobalt.svg"/></div><div class="t l"><img src="iter2/l-b-chk-cobalt.svg"/></div></div><figcaption><b>17</b> Cobalt chequer<span>b-chk-cobalt</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-redblack.svg"/></div><div class="t l"><img src="iter2/l-b-chk-redblack.svg"/></div></div><figcaption><b>18</b> Red + mono chequer<span>b-chk-redblack</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-heat.svg"/></div><div class="t l"><img src="iter2/l-b-chk-heat.svg"/></div></div><figcaption><b>19</b> Heat chequer<span>b-chk-heat</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-b-chk-dissolve.svg"/></div><div class="t l"><img src="iter2/l-b-chk-dissolve.svg"/></div></div><figcaption><b>20</b> Chequer breaking up<span>b-chk-dissolve</span></figcaption></figure></div></section><section><h2>C · Hybrids</h2><div class="grid"><figure><div class="pair"><div class="t d"><img src="iter2/d-c-solid-then-chk.svg"/></div><div class="t l"><img src="iter2/l-c-solid-then-chk.svg"/></div></div><figcaption><b>21</b> Solid lead bar, chequer behind<span>c-solid-then-chk</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-c-cobalt-redline.svg"/></div><div class="t l"><img src="iter2/l-c-cobalt-redline.svg"/></div></div><figcaption><b>22</b> Cobalt fade + red cut line<span>c-cobalt-redline</span></figcaption></figure><figure><div class="pair"><div class="t d"><img src="iter2/d-c-chk-tail.svg"/></div><div class="t l"><img src="iter2/l-c-chk-tail.svg"/></div></div><figcaption><b>23</b> Chequer only on the tail<span>c
